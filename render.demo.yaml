# DEMO blueprint: sandbox payments (fake money), dev seed accounts, files in Neon storage, emails written to disk.
# FREE tier: app sleeps after 15 min idle, files live in Neon object storage, database is external (Render allows one free Postgres per workspace and forgeline-db has it).
# NOT for real customers. Production uses render.yaml. SEED_PASSWORD is set at approval time, never committed.
services:
  - type: web
    name: artwork-demo
    runtime: docker
    plan: free
    dockerCommand: sh scripts/demo-start.sh
    healthCheckPath: /api/health
    envVars:
      - { key: APP_ENV, value: development }
      - { key: PAYMENT_PROVIDER, value: sandbox }
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: S3_BUCKET, value: uploads }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_REGION, value: us-east-2 }
      - { key: S3_FORCE_PATH_STYLE, value: "true" }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: EMAIL_DRIVER, value: file }
      - { key: EMAIL_FILE_DIR, value: /tmp/mail }
      - { key: DATABASE_URL, sync: false }   # free Postgres from Neon or Supabase (direct, not pooled)
      - { key: DATABASE_SSL, value: require }
      - { key: SEED_PASSWORD, sync: false }

# DEMO blueprint: sandbox payments (fake money), dev seed accounts, files on a disk, emails written to disk.
# NOT for real customers. Production uses render.yaml. SEED_PASSWORD is set at approval time, never committed.
databases:
  - name: artwork-demo-db
    plan: basic-256mb
    databaseName: artwork
services:
  - type: web
    name: artwork-demo
    runtime: docker
    plan: starter
    dockerCommand: sh scripts/demo-start.sh
    healthCheckPath: /api/health
    disk: { name: demo-files, mountPath: /data, sizeGB: 5 }
    envVars:
      - { key: APP_ENV, value: development }
      - { key: PAYMENT_PROVIDER, value: sandbox }
      - { key: STORAGE_DRIVER, value: local }
      - { key: STORAGE_LOCAL_DIR, value: /data/files }
      - { key: EMAIL_DRIVER, value: file }
      - { key: EMAIL_FILE_DIR, value: /data/mail }
      - { key: DATABASE_URL, fromDatabase: { name: artwork-demo-db, property: connectionString } }
      - { key: SEED_PASSWORD, sync: false }
